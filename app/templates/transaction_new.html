{% extends "base.html" %}
{% block title %}Add Transaction{% endblock %}
{% block content %}
<h2>Add transaction</h2>
{% if not accounts %}
<p class="empty">You need at least one account first. <a href="/accounts/new">Add one</a>.</p>
{% else %}
<form class="form-card" method="post" action="/transactions">
  <div class="row">
    <div>
      <label for="type">Type</label>
      <select id="type" name="type" required onchange="toggleFields()">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
        <option value="transfer">Transfer (e.g. credit card payment)</option>
      </select>
    </div>
    <div>
      <label for="date">Date</label>
      <input id="date" name="date" type="date" value="{{ today }}" required />
    </div>
  </div>

  <div class="row">
    <div>
      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" step="0.01" min="0.01" required />
    </div>
    <div>
      <label for="account_id">Account</label>
      <select id="account_id" name="account_id" required>
        {% for a in accounts %}
        <option value="{{ a.id }}">{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div id="to_account_field" style="display:none">
    <label for="to_account_id">To account</label>
    <select id="to_account_id" name="to_account_id">
      {% for a in accounts %}
      <option value="{{ a.id }}">{{ a.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="category_field">
    <label for="category_id">Category</label>
    <select id="category_id" name="category_id">
      <option value="">(none)</option>
      {% for c in categories %}
      <option value="{{ c.id }}" data-kind="{{ c.kind.value }}">{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="cadence">Cadence</label>
    <select id="cadence" name="cadence">
      {% for c in cadences %}
      <option value="{{ c.value }}" {{ "selected" if c.value == "one_time" else "" }}>{{ c.value.replace('_', ' ') }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="note">Note</label>
    <input id="note" name="note" placeholder="optional" />
  </div>

  <div id="reimbursable_field">
    <label><input type="checkbox" name="reimbursable" value="1" style="width:auto;display:inline-block;" /> Reimbursable (I'll get this money back)</label>
  </div>

  <button type="submit">Save</button>
</form>

<script>
function toggleFields() {
  const type = document.getElementById('type').value;
  document.getElementById('to_account_field').style.display = (type === 'transfer') ? 'block' : 'none';
  document.getElementById('category_field').style.display = (type === 'transfer') ? 'none' : 'block';
  document.getElementById('reimbursable_field').style.display = (type === 'expense') ? 'block' : 'none';
}
toggleFields();
</script>
{% endif %}
{% endblock %}
